[build]
command = "pnpm web build:h5-netlify:only"
publish = "apps/web/dist"
functions = "apps/web/netlify/functions"

[dev]
command = "pnpm web dev"
framework = "vite"
targetPort = 5173
publish = "dist"

# 分享页面路由 → Netlify Function
[[redirects]]
from = "/s/:id"
to = "/.netlify/functions/share-get?id=:id"
status = 200

# SPA 路由兜底
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# ── 缓存策略 ───────────────────────────────────────
# 静态资源（JS/CSS/字体/图片）使用 content hash 文件名，可长期缓存
[[headers]]
for = "/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.woff2"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# index.html 不缓存，确保用户始终获取最新版本
[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
